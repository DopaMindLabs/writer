name: Whitelist Dexie Cloud Origin

on:
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'
      - 'vercel.deployment.success'
  workflow_dispatch:
    inputs:
      url:
        description: 'Origin URL to whitelist (e.g. https://lipsumwriter-git-branch-shavindra.vercel.app)'
        required: true

jobs:
  whitelist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24

      - name: Validate and whitelist origin
        env:
          # Event data reaches the shell through env, never interpolated into the
          # script body — a quote or newline in the value cannot become shell.
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          INPUT_URL: ${{ github.event.inputs.url }}
          DEXIE_CLOUD_JSON: ${{ secrets.DEXIE_CLOUD_JSON }}
          DEXIE_CLOUD_KEY: ${{ secrets.DEXIE_CLOUD_KEY }}
        run: |
          set -euo pipefail

          # Validate against the Writer allow-list before anything touches the
          # credentials. A disallowed or malformed URL exits non-zero here; the
          # scheme is never silently prepended.
          RAW="${DISPATCH_URL:-$INPUT_URL}"
          ORIGIN="$(node scripts/preview-origin.mjs "$RAW")"
          echo "Whitelisting validated origin: $ORIGIN"

          umask 077
          WORKDIR="$(mktemp -d)"
          cleanup() { rm -rf "$WORKDIR"; }
          trap cleanup EXIT INT TERM

          printf '%s' "$DEXIE_CLOUD_JSON" > "$WORKDIR/dexie-cloud.json"
          printf '%s' "$DEXIE_CLOUD_KEY" > "$WORKDIR/dexie-cloud.key"

          ( cd "$WORKDIR" && npx --yes dexie-cloud whitelist "$ORIGIN" )
