name: E2E smoke (Vercel preview)

# Fires when Vercel's GitHub integration reports a deployment's status. Unlike
# e2e.yml (which builds and serves the app locally, byte-for-byte independent
# of any external service), this job exercises the actual deployed artifact —
# real vercel.json CSP headers included, which a local Playwright preview
# never applies at all. Cloud-sync specs are excluded (see
# playwright.preview.config.ts); coverage is not collected here, so this
# workflow never feeds the e2e coverage ratchet in e2e.yml.
on:
  deployment_status:
  # deployment_status only dispatches the workflow file on the default branch,
  # so allow a manual run against an explicit preview URL for branches (and for
  # re-running a smoke without redeploying).
  workflow_dispatch:
    inputs:
      preview_url:
        description: Full URL of the deployed preview to smoke-test
        required: true
        type: string

concurrency:
  group: e2e-preview-${{ github.event.deployment.id || github.event.inputs.preview_url }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: E2E smoke test against the deployed preview
        env:
          E2E_BASE_URL: ${{ github.event.inputs.preview_url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config=playwright.preview.config.ts

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-preview-report
          path: playwright-report/
          retention-days: 14
