name: Branch name

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Enforce Conventional Commit branch prefix
        env:
          # Passed through the environment rather than interpolated into the
          # run script: a branch name is attacker-controlled, and inlining it
          # would let a crafted name inject shell commands into the runner.
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/validate-branch-name.mjs "$HEAD_REF"
